name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Stdlib only: pytest is the sole install.
      - name: Install pytest
        run: pip install pytest

      - name: Compile every module
        run: python -m py_compile *.py

      - name: Tests
        run: python -m pytest -q

      # Held-out recall eval: fails if BM25 recall@3 or MRR drops below the
      # measured baseline minus tolerance (constants in eval/run_eval.py).
      - name: Recall eval gate
        run: python eval/run_eval.py --check
